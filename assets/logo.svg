<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b9dff"/><stop offset=".5" stop-color="#a371f7"/><stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
  </defs>
  <!-- same frame as Motherboard: dark rounded square + inner border -->
  <rect width="256" height="256" rx="52" fill="#0c0f14"/>
  <rect x="20" y="20" width="216" height="216" rx="40" fill="none" stroke="#222a35" stroke-width="2"/>
  <!-- input question node (top) -->
  <circle cx="128" cy="58" r="10" fill="#5b9dff"/>
  <path d="M128 68 V92" stroke="#303a48" stroke-width="3"/>
  <!-- root: gradient diamond (the decompose core) -->
  <rect x="100" y="100" width="56" height="56" rx="14" transform="rotate(45 128 128)" fill="url(#g)"/>
  <!-- edges fanning to grounded leaves: AND solid, OR dashed -->
  <path d="M110 146 L72 190" stroke="#5b9dff" stroke-width="3.5" fill="none"/>
  <path d="M128 160 L128 192" stroke="#a371f7" stroke-width="3.5" stroke-dasharray="7 5" fill="none"/>
  <path d="M146 146 L184 190" stroke="#3fb950" stroke-width="3.5" fill="none"/>
  <!-- leaf nodes (grounded answers) -->
  <circle cx="72" cy="198" r="10" fill="#5b9dff"/>
  <circle cx="128" cy="198" r="10" fill="#39c5cf"/>
  <circle cx="184" cy="198" r="10" fill="#3fb950"/>
</svg>
